<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>강릉 EASY</title><style>body{font-family:Arial,"Noto Sans KR",sans-serif;margin:0;background:#fff8ec;color:#123}main{max-width:1100px;margin:auto;padding:24px}.hero{padding:70px 30px;border-radius:24px;background:linear-gradient(90deg,#063949dd,#06394955),url("https://cdn.visitkorea.or.kr/img/call?cmd=VIEW&id=03ed6a45-17b1-4fad-8b67-9e70ff91e6da") center/cover;color:white}.hero h1{font-size:clamp(3rem,8vw,6rem);margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;padding:16px;border:1px solid #d8e6e5;border-radius:16px}.card img{width:100%;height:210px;object-fit:cover;border-radius:12px}.bus{display:inline-block;background:#dff5f7;padding:5px 9px;border-radius:20px;font-weight:bold}.source{font-size:12px;color:#688;display:block;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><small>GANGNEUNG EASY · 강릉 여행</small><h1>강릉,<br>바다와 맛을 쉽게.</h1><p>강릉역 출발 버스 노선과 강릉 명소·대표 음식의 실제 사진을 한 화면에서 확인하세요.</p></section><h2>강릉역 출발 버스 노선</h2><div class="grid" id="bus"></div><h2>강릉 대표 음식 실제 사진</h2><div class="grid" id="food"></div><h2>강릉 포토스팟</h2><div class="grid" id="spot"></div></main><script>

>${x[0]} <small>${x[1]}</small></h3><a href="${m(x[0])}" target="_blank">지도 열기</a><a class="source" href="https://www.gn.go.kr/www/contents.do?key=1663" target="_blank">사진 출처: ${x[3]}</a></article>`).join("");document.getElementById("spot").innerHTML=S.map(x=>`<article class="card"><img src="${x[2]}" alt="${x[0]}"><h3>${x[0]} <small>${x[1]}</small></h3><span class="bus">${x[3]}</span><p>강릉역 출발 추천 노선</p><a href="${m(x[0])}" target="_blank">지도 열기</a><a class="source" href="https://www.gn.go.kr/www/contents.do?key=1663" target="_blank">강릉시 여행정보</a></article>`).join("");
</script></body></html>
