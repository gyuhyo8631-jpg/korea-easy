]}</h3><div class="facts">${x[1]}</div><a class="btn" target="_blank" href="${M(x[1])}">${t.dir}</a></article>`).join('');document.getElementById('photoGrid').innerHTML=P.map(x=>`<article class="card photo"><img src="${x[2]}" alt="${x[0]}" loading="lazy"><div class="body"><div class="meta">${t.best}: ${x[3]}</div><h3>${x[0]}</h3><div class="facts">${x[1]}</div><a class="btn" target="_blank" href="${M(x[1])}">${t.dir}</a></div></article>`).join('')}document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('jejuEasyLang',lang);render()});render();</script></body></html>
