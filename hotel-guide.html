<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotel Guide | KOREA EASY</title><style>body{margin:0;font-family:Inter,Arial,'Noto Sans JP',sans-serif;background:#f4f0e7;color:#17231d}.wrap{width:min(950px,92%);margin:auto}header{padding:18px 0;background:#fff;border-bottom:1px solid #ddd}.brand{font-weight:950;text-decoration:none;color:inherit}.brand span{color:#1e6d4d}.hero{margin:28px 0;padding:38px;border-radius:28px;background:#17231d;color:white}.hero h1{font-size:clamp(2.5rem,8vw,5.5rem);margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid #d8e0d7;border-radius:20px;padding:20px}.btn{display:inline-block;margin-top:10px;padding:11px 14px;border-radius:12px;background:#1e6d4d;color:white;text-decoration:none;font-weight:900}.langs button{border:1px solid #ddd;background:white;padding:8px 10px;border-radius:999px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap" style="display:flex;justify-content:space-between"><a class="brand" href="./">KOREA <span>EASY</span></a><div class="langs"><button onclick="setL('ja')">日本語</button> <button onclick="setL('en')">EN</button> <button onclick="setL('zh')">中文</button></div></div></header><main class="wrap"><section class="hero"><div id="badge"></div><h1>HOTEL</h1><p id="lead"></p></section><section class="grid" id="cards"></section><p id="foot" style="margin:28px 0 50px;color:#68736c;line-height:1.7"></p></main><script>const C={ja:{badge:'宿泊ガイド',lead:'ホテルに入る前に、予約名・住所・チェックイン時間・パスポートを確認しましょう。',cards:[['1. 予約を確認','予約者名、宿泊日、人数、部屋タイプを確認。予約画面をオフラインでも見られるよう保存すると便利です。'],['2. ホテルへ移動','ホテル名と住所を韓国語・英語で保存。地図アプリやタクシーでそのまま提示できます。'],['3. チェックイン','フロントで予約名とパスポートを提示します。チェックイン可能時間はホテルごとに異なります。'],['4. 早く着いた場合','チェックイン前でも荷物を預けられるホテルがあります。必ずホテルに確認してください。'],['5. 深夜到着','フロント営業時間やセルフチェックイン方法を事前確認。深夜は入口が施錠される宿泊施設もあります。'],['6. 予約サービス連携','今後KOREA EASYから地域・空港・観光地とホテル検索をつなげ、予約サイトへ移動できる構造に拡張します。']],foot:'特定ホテル「リオ」を追加する場合は、正式なホテル名と都市が分かれば専用カード・地図・予約導線を追加できます。'},en:{badge:'STAY GUIDE',lead:'Before entering your hotel, check the booking name, address, check-in time and passport requirements.',cards:[['1. Check booking','Confirm guest name, dates, party size and room type. Save the confirmation for offline access.'],['2. Get to the hotel','Save the hotel name and address in Korean and English for maps and taxis.'],['3. Check in','Show your booking name and passport at reception. Check-in times vary by property.'],['4. Arriving early','Some hotels can store luggage before check-in. Confirm directly with the property.'],['5. Late-night arrival','Check reception hours and self-check-in instructions before travel.'],['6. Booking connection','KOREA EASY can expand this into city, airport and attraction-based hotel discovery with links to booking providers.']],foot:'If “Rio” is a specific hotel you want featured, its exact hotel name and city are needed to add the correct map and booking path.'},zh:{badge:'住宿指南',lead:'进入酒店前，请确认预订姓名、地址、入住时间及护照要求。',cards:[['1. 确认预订','确认入住姓名、日期、人数和房型，并保存预订凭证。'],['2. 前往酒店','保存酒店韩文及英文名称和地址，方便地图和出租车使用。'],['3. 办理入住','在前台出示预订姓名和护照，具体入住时间因酒店而异。'],['4. 提前抵达','部分酒店可在入住前寄存行李，请提前向酒店确认。'],['5. 深夜抵达','提前确认前台营业时间及自助入住方法。'],['6. 预订连接','后续可将KOREA EASY的城市、机场和景点与酒店搜索及预订平台连接。']],foot:'如“Rio”是指定酒店，需要准确的酒店名称和城市，才能添加正确的地图和预订入口。'}};function setL(l){localStorage.setItem('koreaEasyLang',l);const x=C[l]||C.ja;document.documentElement.lang=l==='zh'?'zh-CN':l;badge.textContent=x.badge;lead.textContent=x.lead;cards.innerHTML=x.cards.map(x=>`<article class="card"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('');foot.textContent=x.foot}setL(localStorage.getItem('koreaEasyLang')||'ja');</script></body></html>
